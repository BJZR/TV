<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Dominio del backend. Vacío = mismo dominio que esta página.
       Ejemplo: https://tv-api.vercel.app -->
  <meta name="tv-api" content="">
  <title>TV · Resultados de Búsqueda</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #0f172a;
      --card-hover: #162036;
      --line: rgba(255, 255, 255, 0.08);
      --acc: #38bdf8;
      --acc-glow: rgba(56, 189, 248, 0.25);
      --acc-video: #a78bfa;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(1100px 620px at 50% -10%, #172554 0%, var(--bg) 70%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding: 1.5rem clamp(1rem, 4vw, 3rem) 4rem;
    }

    .container {
      max-width: 1050px;
      margin: 0 auto;
    }

    .top {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--line);
    }

    .exit {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(56, 189, 248, 0.12);
      color: var(--acc);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 0.6rem 1rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .exit:hover, .exit:focus { background: var(--acc); color: #090d16; outline: none; }

    .searchbar {
      flex: 1;
      min-width: 260px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0.45rem 0.5rem 0.45rem 1rem;
      transition: all 0.2s ease;
    }
    .searchbar:focus-within { border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-glow); }
    .searchbar input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 1.05rem;
      padding: 0.45rem 0;
    }
    .searchbar input::placeholder { color: #64748b; }
    .searchbar button {
      background: var(--acc);
      color: #090d16;
      border: none;
      border-radius: 10px;
      padding: 0.6rem 1.25rem;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .searchbar button:hover { background: #7dd3fc; }

    .head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      margin: 1.8rem 0 1rem;
    }
    .head h1 { font-size: clamp(1.3rem, 3vw, 1.8rem); font-weight: 800; letter-spacing: -0.5px; }
    .head h1 b { color: var(--acc); }
    .count { color: var(--muted); font-size: 0.9rem; font-weight: 500; }
    .srcs { color: var(--muted); font-size: 0.85rem; margin-top: 0.2rem; width: 100%; }
    .notice { color: #fde047; font-size: 0.85rem; margin-top: 0.2rem; display: block; }

    .tabs { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .tab {
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--line);
      padding: 0.55rem 1.1rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab.on { background: var(--acc); color: #090d16; border-color: var(--acc); font-weight: 700; }
    .tab:hover:not(.on) { color: var(--text); border-color: rgba(255, 255, 255, 0.2); }

    .list { display: grid; gap: 0.85rem; }

    .res {
      display: grid;
      grid-template-columns: 48px 1fr auto;
      gap: 1.1rem;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 1.1rem 1.25rem;
      transition: all 0.2s ease;
    }
    .res:hover {
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateY(-2px);
      background: var(--card-hover);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .ico {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: #1e293b;
      object-fit: contain;
      padding: 6px;
    }

    .meta { min-width: 0; }
    .t {
      font-weight: 700;
      font-size: 1.08rem;
      line-height: 1.35;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .t span.txt { overflow: hidden; text-overflow: ellipsis; color: var(--text); }
    .snip {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 0.35rem;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .src { color: #64748b; font-size: 0.8rem; margin-top: 0.4rem; font-weight: 500; }

    .tag {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .tag.plataforma { background: rgba(56, 189, 248, 0.16); color: var(--acc); border-color: rgba(56, 189, 248, 0.3); }
    .tag.video { background: rgba(167, 139, 250, 0.18); color: var(--acc-video); border-color: rgba(167, 139, 250, 0.35); }
    .tag.info { background: rgba(148, 163, 184, 0.14); color: var(--muted); border-color: var(--line); }
    .tag.web { background: rgba(255, 255, 255, 0.06); color: #cbd5e1; border-color: var(--line); }
    .tag.ok { background: rgba(34, 197, 94, 0.18); color: #4ade80; border-color: rgba(34, 197, 94, 0.3); }
    .tag.yr { font-variant-numeric: tabular-nums; background: rgba(255, 255, 255, 0.08); color: var(--muted); }

    .go {
      background: var(--acc);
      color: #090d16;
      border: 1px solid var(--acc);
      padding: 0.65rem 1.25rem;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.92rem;
      text-decoration: none;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .go:hover, .go:focus {
      background: #7dd3fc;
      border-color: #7dd3fc;
      box-shadow: 0 0 15px var(--acc-glow);
    }
    .go.video-go {
      background: #a78bfa;
      border-color: #a78bfa;
      color: #090d16;
    }
    .go.video-go:hover { background: #c084fc; border-color: #c084fc; }

    .state {
      color: var(--muted);
      text-align: center;
      padding: 4rem 1rem;
      line-height: 1.6;
    }
    .state b { color: var(--text); display: block; font-size: 1.2rem; margin-bottom: 0.5rem; }
    .state .spin {
      width: 30px; height: 30px; margin: 0 auto 1.2rem;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: var(--acc);
      border-radius: 50%;
      animation: sp 0.8s linear infinite;
    }
    @keyframes sp { to { transform: rotate(360deg); } }

    .ver { position: fixed; right: 0.8rem; bottom: 0.6rem; font-size: 0.75rem; color: #64748b; opacity: 0.7; z-index: 5; }
    .ver:hover { opacity: 1; }

    @media (max-width: 640px) {
      .res { grid-template-columns: 40px 1fr; gap: 0.8rem; }
      .go { grid-column: 1 / -1; justify-content: center; width: 100%; text-align: center; margin-top: 0.3rem; }
      .exit span { display: none; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="top">
      <a class="exit" href="/" title="Volver al launcher">← <span>Launcher</span></a>
      <form class="searchbar" id="form" autocomplete="off">
        <input id="q" type="search" placeholder="Buscar películas, series o videos…" aria-label="Buscar películas o videos" tabindex="0">
        <button type="submit" tabindex="0">Buscar</button>
      </form>
    </header>

    <main>
      <div class="head">
        <h1 id="title">Resultados</h1>
        <span class="count" id="count"></span>
        <span class="srcs" id="srcs"></span>
        <span class="notice" id="notice"></span>
      </div>

      <nav class="tabs" id="tabs">
        <button class="tab on" data-k="all" tabindex="0">Todo</button>
        <button class="tab" data-k="video" tabindex="0">Videos y Stream</button>
        <button class="tab" data-k="plataforma" tabindex="0">Plataformas</button>
        <button class="tab" data-k="info" tabindex="0">Ficha e Info</button>
      </nav>

      <div class="list" id="list"></div>
      <p class="state" id="state"></p>
    </main>
  </div>

  <div class="ver" id="ver"></div>

  <script>
  (() => {
    'use strict';

    const $ = s => document.querySelector(s);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const safeUrl = u => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : '#'; } catch { return '#'; } };
    // Backend: el de esta misma página si no se indica otro dominio.
    const API = (document.querySelector('meta[name="tv-api"]')?.content || '').replace(/\/+$/, '');

    // El launcher vive en / cuando lo sirve el binario de Go. Sin él (archivo
    // suelto u hosting estático) se cae al index.html para no dejar un 404.
    (function () {
      const link = $('.exit');
      if (!link) return;
      const fallback = () => { link.href = 'index.html'; };
      if (location.protocol === 'file:') return fallback();
      fetch('/', { method: 'HEAD' })
        .then(r => { if (!r.ok) fallback(); })
        .catch(fallback);
    })();

    const TAGS = { plataforma: 'plataforma', video: 'video', info: 'info', web: 'web' };
    const list = $('#list'), state = $('#state'), title = $('#title'), count = $('#count'), srcs = $('#srcs'), notice = $('#notice');

    let query = new URLSearchParams(location.search).get('q') || '';
    let all = [], sources = [], lastNotice = '', filter = 'all', token = 0;

    function say(html) { state.innerHTML = html; state.hidden = !html; }
    function loading() { list.innerHTML = ''; say('<span class="spin"></span>Buscando videos y enlaces en toda la web…'); }

    async function search(q) {
      query = q.trim();
      $('#q').value = query;
      if (!query) {
        all = [];
        title.textContent = 'Resultados';
        count.textContent = '';
        srcs.textContent = '';
        notice.textContent = '';
        list.innerHTML = '';
        say('<b>Escribe el nombre de lo que quieres ver</b>Arriba tienes el buscador. Escribe el título y te mostramos todos los enlaces.');
        return;
      }
      title.innerHTML = 'Resultados de <b>' + esc(query) + '</b>';
      const mine = ++token;
      loading();
      try {
        const res = await fetch(API + '/api/search?q=' + encodeURIComponent(query) + '&limit=40', {
          headers: { Accept: 'application/json' },
        });
        const data = await res.json();
        if (mine !== token) return; // llegó otra búsqueda mientras esperaba
        if (!res.ok) throw new Error(data.error || 'No se pudo buscar');
        all = data.results || [];
        sources = data.sources || [];
        lastNotice = data.notice || '';
        render();
      } catch (err) {
        if (mine !== token) return;
        all = [];
        say('<b>No se pudo buscar</b>' + esc(err.message || 'revisa tu conexión') +
          (location.protocol === 'file:' ? '<br><br>Abriendo el archivo directamente no hay servidor: ejecuta <code>go run .</code> y entra por http://localhost:8080' : ''));
        count.textContent = '';
      }
    }

    function visible() {
      return filter === 'all' ? all : all.filter(r => r.kind === filter);
    }

    function render() {
      const rs = visible();
      count.textContent = all.length ? rs.length + ' de ' + all.length : '';
      srcs.textContent = sources.length > 1
        ? 'Buscado en ' + sources.join(', ') + '. Búsqueda global en toda la web.'
        : '';
      notice.textContent = lastNotice;
      if (!all.length) {
        list.innerHTML = '';
        say('<b>Sin resultados por ahora</b>Prueba con el título en el idioma original o sin el año.');
        return;
      }
      if (!rs.length) {
        list.innerHTML = '';
        say('<b>Sin resultados en esta categoría</b>Cambia el filtro arriba para ver todos los demás enlaces.');
        return;
      }
      say('');
      list.innerHTML = rs.map(r => {
        const isVid = r.kind === 'video';
        const actionText = isVid ? '▶ Ver video ↗' : (r.platform ? 'Ver en ' + esc(r.platform) + ' ↗' : 'Abrir ↗');
        const btnClass = isVid ? 'go video-go' : 'go';

        return `
        <article class="res">
          <img class="ico" src="${esc(r.favicon || '')}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
          <div class="meta">
            <div class="t"><span class="txt">${esc(r.title)}</span>
              ${r.platform ? `<span class="tag ${esc(TAGS[r.kind] || 'web')}">${esc(r.platform)}</span>` : ''}
              ${r.year ? `<span class="tag yr">${esc(r.year)}</span>` : ''}
              ${r.votes > 1 ? `<span class="tag ok">${r.votes} fuentes</span>` : ''}
            </div>
            ${r.snippet ? `<p class="snip">${esc(r.snippet)}</p>` : ''}
            <p class="src">${esc(r.host)}</p>
          </div>
          <a class="${btnClass}" href="${esc(safeUrl(r.url))}" target="_blank" rel="noopener noreferrer">${actionText}</a>
        </article>`;
      }).join('');
    }

    $('#form').addEventListener('submit', e => {
      e.preventDefault();
      const q = $('#q').value.trim();
      if (!q) return;
      history.replaceState(null, '', location.pathname + '?q=' + encodeURIComponent(q));
      search(q);
    });

    $('#tabs').addEventListener('click', e => {
      const b = e.target.closest('.tab');
      if (!b) return;
      filter = b.dataset.k;
      [...$('#tabs').children].forEach(t => t.classList.toggle('on', t === b));
      render();
    });

    document.addEventListener('keydown', e => {
      if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); }
    });

    search(query);
    $('#q').focus();

    // Qué build está sirviendo esta página: si el número no cambia tras editar
    // el código, el servidor viejo sigue ocupando el puerto.
    fetch(API + '/api/version', { headers: { Accept: 'application/json' } })
      .then(r => r.json())
      .then(v => { const el = document.getElementById('ver'); if (el) el.textContent = 'tv v' + v.version + ' · ' + v.built; })
      .catch(() => {});

  })();
  </script>
</body>
</html>
