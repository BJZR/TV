<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Dominio del backend. Vacío = mismo dominio que esta página.
       Ejemplo: https://tv-api.vercel.app -->
  <meta name="tv-api" content="">
  <title>TV · Resultados</title>
  <style>
    :root {
      --bg: #070b14;
      --card: #0f172a;
      --line: rgba(255, 255, 255, 0.09);
      --acc: #38bdf8;
      --acc2: #a78bfa;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(1100px 620px at 78% -12%, #14213d 0%, var(--bg) 62%);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      min-height: 100vh;
      padding: 1.6rem clamp(1rem, 4vw, 3rem) 4rem;
    }

    .top {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      padding-bottom: 1.1rem;
      border-bottom: 1px solid var(--line);
    }

    .exit {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      background: rgba(56, 189, 248, .12);
      color: var(--acc);
      border: 1px solid rgba(56, 189, 248, .3);
      padding: .65rem 1rem;
      border-radius: 10px;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
    }
    .exit:hover { background: var(--acc); color: #08111f; }

    .searchbar {
      flex: 1;
      min-width: 260px;
      display: flex;
      align-items: center;
      gap: .5rem;
      background: rgba(15, 23, 42, .9);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: .45rem .5rem .45rem 1rem;
    }
    .searchbar:focus-within { border-color: var(--acc); }
    .searchbar input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 1rem;
      padding: .5rem 0;
    }
    .searchbar input::placeholder { color: #64748b; }
    .searchbar button {
      background: var(--acc);
      color: #08111f;
      border: none;
      border-radius: 9px;
      padding: .55rem 1.15rem;
      font-weight: 700;
      cursor: pointer;
    }

    .head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      margin: 1.6rem 0 .9rem;
    }
    .head h1 { font-size: clamp(1.25rem, 3vw, 1.7rem); letter-spacing: -.4px; }
    .head h1 b { color: var(--acc); }
    .count { color: var(--muted); font-size: .9rem; }
    .srcs { color: var(--muted); font-size: .82rem; margin-top: .15rem; }
    .tag.ok { background: #14361f; color: #7ee2a8; }
    .notice { color: #e8c07a; font-size: .84rem; margin-top: .1rem; }

    .tabs { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1.4rem; }
    .tab {
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--line);
      padding: .5rem 1rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: .88rem;
      cursor: pointer;
    }
    .tab.on { background: var(--acc); color: #08111f; border-color: var(--acc); }
    .tab:hover:not(.on) { color: var(--text); }

    .list { display: grid; gap: .75rem; }

    .res {
      display: grid;
      grid-template-columns: 46px 1fr auto;
      gap: 1rem;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1rem 1.1rem;
      transition: border-color .15s, transform .15s, background .15s;
    }
    .res:hover { border-color: rgba(56, 189, 248, .5); transform: translateY(-2px); background: #111d33; }

    .ico {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: #1e293b;
      object-fit: contain;
      padding: 5px;
    }

    .meta { min-width: 0; }
    .t {
      font-weight: 600;
      font-size: 1.03rem;
      line-height: 1.35;
      display: flex;
      align-items: center;
      gap: .5rem;
      flex-wrap: wrap;
    }
    .t span.txt { overflow: hidden; text-overflow: ellipsis; }
    .snip {
      color: var(--muted);
      font-size: .88rem;
      margin-top: .3rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .src { color: #64748b; font-size: .8rem; margin-top: .35rem; }

    .tag {
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .3px;
      text-transform: uppercase;
      padding: .18rem .5rem;
      border-radius: 6px;
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .tag.plataforma { background: rgba(56, 189, 248, .16); color: var(--acc); border-color: rgba(56, 189, 248, .35); }
    .tag.video { background: rgba(167, 139, 250, .16); color: var(--acc2); border-color: rgba(167, 139, 250, .35); }
    .tag.info { background: rgba(148, 163, 184, .14); color: var(--muted); border-color: var(--line); }
    .tag.web { background: rgba(255, 255, 255, .06); color: #cbd5e1; border-color: var(--line); }
    .tag.yr { font-variant-numeric: tabular-nums; }

    .go {
      background: rgba(56, 189, 248, .12);
      color: var(--acc);
      border: 1px solid rgba(56, 189, 248, .3);
      padding: .6rem 1rem;
      border-radius: 10px;
      font-weight: 600;
      font-size: .88rem;
      text-decoration: none;
      white-space: nowrap;
    }
    .go:hover { background: var(--acc); color: #08111f; }

    .state {
      color: var(--muted);
      text-align: center;
      padding: 3.5rem 1rem;
      line-height: 1.6;
    }
    .state b { color: var(--text); display: block; font-size: 1.1rem; margin-bottom: .4rem; }
    .state .spin {
      width: 26px; height: 26px; margin: 0 auto 1rem;
      border: 3px solid rgba(56, 189, 248, .25);
      border-top-color: var(--acc);
      border-radius: 50%;
      animation: sp .8s linear infinite;
    }
    @keyframes sp { to { transform: rotate(360deg); } }

    @media (max-width: 640px) {
      .res { grid-template-columns: 40px 1fr; }
      .go { grid-column: 1 / -1; text-align: center; }
      .exit span { display: none; }
    }
  </style>
</head>
<body>

  <header class="top">
    <a class="exit" href="/" title="Volver al launcher">← <span>Launcher</span></a>
    <form class="searchbar" id="form" autocomplete="off">
      <input id="q" type="search" placeholder="Película a buscar…" aria-label="Buscar película" tabindex="0">
      <button type="submit" tabindex="0">Buscar</button>
    </form>
  </header>

  <main>
    <div class="head">
      <h1 id="title">Resultados</h1>
      <span class="count" id="count"></span>
      <span class="srcs" id="srcs"></span>
      <span class="notice" id="notice"></span>
    </div>

    <nav class="tabs" id="tabs">
      <button class="tab on" data-k="all" tabindex="0">Todo</button>
      <button class="tab" data-k="plataforma" tabindex="0">Plataformas</button>
      <button class="tab" data-k="video" tabindex="0">Video</button>
      <button class="tab" data-k="info" tabindex="0">Ficha y info</button>
    </nav>

    <div class="list" id="list"></div>
    <p class="state" id="state"></p>
  </main>

  <script>
  (() => {
    'use strict';

    const $ = s => document.querySelector(s);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const safeUrl = u => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : '#'; } catch { return '#'; } };
    // Backend: el de esta misma página si no se indica otro dominio.
    const API = (document.querySelector('meta[name="tv-api"]')?.content || '').replace(/\/+$/, '');

    // El launcher vive en / cuando lo sirve el binario de Go. Sin él (archivo
    // suelto u hosting estático) se cae al index.html para no dejar un 404.
    (function () {
      const link = $('.exit');
      if (!link) return;
      const fallback = () => { link.href = 'index.html'; };
      if (location.protocol === 'file:') return fallback();
      fetch('/', { method: 'HEAD' })
        .then(r => { if (!r.ok) fallback(); })
        .catch(fallback);
    })();

    const TAGS = { plataforma: 'plataforma', video: 'video', info: 'info', web: 'web' };
    const list = $('#list'), state = $('#state'), title = $('#title'), count = $('#count'), srcs = $('#srcs'), notice = $('#notice');

    let query = new URLSearchParams(location.search).get('q') || '';
    let all = [], sources = [], lastNotice = '', filter = 'all', token = 0;

    function say(html) { state.innerHTML = html; state.hidden = !html; }
    function loading() { list.innerHTML = ''; say('<span class="spin"></span>Buscando en la web…'); }

    async function search(q) {
      query = q.trim();
      $('#q').value = query;
      if (!query) {
        all = [];
        title.textContent = 'Resultados';
        count.textContent = '';
        srcs.textContent = '';
        notice.textContent = '';
        list.innerHTML = '';
        say('<b>Escribe el nombre de una película</b>Arriba tienes el buscador. Escribe el título y te digo dónde verla.');
        return;
      }
      title.innerHTML = 'Resultados de <b>' + esc(query) + '</b>';
      const mine = ++token;
      loading();
      try {
        const res = await fetch(API + '/api/search?q=' + encodeURIComponent(query) + '&limit=40', {
          headers: { Accept: 'application/json' },
        });
        const data = await res.json();
        if (mine !== token) return; // llegó otra búsqueda mientras esperaba
        if (!res.ok) throw new Error(data.error || 'No se pudo buscar');
        all = data.results || [];
        sources = data.sources || [];
        lastNotice = data.notice || '';
        render();
      } catch (err) {
        if (mine !== token) return;
        all = [];
        say('<b>No se pudo buscar</b>' + esc(err.message || 'revisa tu conexión') +
          (location.protocol === 'file:' ? '<br><br>Abriendo el archivo directamente no hay servidor: ejecuta <code>go run .</code> y entra por http://localhost:8080' : ''));
        count.textContent = '';
      }
    }

    function visible() {
      return filter === 'all' ? all : all.filter(r => r.kind === filter);
    }

    function render() {
      const rs = visible();
      count.textContent = all.length ? rs.length + ' de ' + all.length : '';
      srcs.textContent = sources.length > 1
        ? 'Buscado en ' + sources.join(', ') + '. Si varios índices lo señalan, más seguro.'
        : '';
      notice.textContent = data.notice || '';
      if (!all.length) {
        list.innerHTML = '';
        say('<b>Nada por ahora</b>Prueba con el título en el idioma original, o sin el año.');
        return;
      }
      if (!rs.length) {
        list.innerHTML = '';
        say('<b>Sin resultados de este tipo</b>Cambia el filtro para ver los demás.');
        return;
      }
      say('');
      list.innerHTML = rs.map(r => `
        <article class="res">
          <img class="ico" src="${esc(r.favicon || '')}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
          <div class="meta">
            <div class="t"><span class="txt">${esc(r.title)}</span>
              ${r.platform ? `<span class="tag ${esc(TAGS[r.kind] || 'web')}">${esc(r.platform)}</span>` : ''}
              ${r.year ? `<span class="tag yr">${esc(r.year)}</span>` : ''}
              ${r.votes > 1 ? `<span class="tag ok">${r.votes} índices</span>` : ''}
            </div>
            ${r.snippet ? `<p class="snip">${esc(r.snippet)}</p>` : ''}
            <p class="src">${esc(r.host)}</p>
          </div>
          <a class="go" href="${esc(safeUrl(r.url))}" target="_blank" rel="noopener noreferrer">Abrir ↗</a>
        </article>`).join('');
    }

    $('#form').addEventListener('submit', e => {
      e.preventDefault();
      const q = $('#q').value.trim();
      if (!q) return;
      history.replaceState(null, '', location.pathname + '?q=' + encodeURIComponent(q));
      search(q);
    });

    $('#tabs').addEventListener('click', e => {
      const b = e.target.closest('.tab');
      if (!b) return;
      filter = b.dataset.k;
      [...$('#tabs').children].forEach(t => t.classList.toggle('on', t === b));
      render();
    });

    document.addEventListener('keydown', e => {
      if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); }
    });

    search(query);
    $('#q').focus();
  })();
  </script>
</body>
</html>
